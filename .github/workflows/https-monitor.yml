name: HTTPS monitor

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: https-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      # No checkout, npm packages, long-lived secrets, or deploys are needed.
      - name: Check TLS, certificate expiry, HTTPS and redirects
        run: |
          node --input-type=module <<'JS'
          import tls from 'node:tls';
          const targets = [
            { host: 'kadastrview.online', path: '/', status: 200 },
            { host: 'www.kadastrview.online', path: '/', status: 301, location: 'https://kadastrview.online/' },
            { host: 'tiles.kadastrview.online', path: '/kadastr/v1/13/4692/2757.pbf', status: 200 },
          ];
          const expiryWarningDays = 14;
          const failures = [];
          function certificate(host) {
            return new Promise((resolve, reject) => {
              const socket = tls.connect({ host, port: 443, servername: host, rejectUnauthorized: true });
              socket.setTimeout(10000, () => socket.destroy(new Error('TLS timeout')));
              socket.once('error', reject);
              socket.once('secureConnect', () => {
                const cert = socket.getPeerCertificate();
                socket.end();
                const expires = Date.parse(cert.valid_to);
                const days = (expires - Date.now()) / 86400000;
                if (!Number.isFinite(days) || days < expiryWarningDays) {
                  reject(new Error(`Certificate expires in ${Math.floor(days)} days (${cert.valid_to})`));
                } else resolve({ expires: cert.valid_to, days: Math.floor(days) });
              });
            });
          }
          for (const target of targets) {
            let error;
            for (let attempt = 1; attempt <= 2; attempt++) {
              try {
                const cert = await certificate(target.host);
                const response = await fetch(`https://${target.host}${target.path}`, {
                  method: 'HEAD', redirect: 'manual', signal: AbortSignal.timeout(10000),
                });
                if (response.status !== target.status) throw new Error(`HTTP ${response.status}; expected ${target.status}`);
                if (target.location && response.headers.get('location') !== target.location) throw new Error('Unexpected www redirect');
                console.log(`${target.host}: HTTPS OK; certificate valid for ${cert.days} days, until ${cert.expires}`);
                error = null;
                break;
              } catch (caught) {
                error = caught;
                if (attempt < 2) await new Promise(resolve => setTimeout(resolve, 2000));
              }
            }
            if (error) failures.push(`${target.host}: ${error.message}`);
          }
          if (failures.length) {
            for (const message of failures) console.error(`::error::${message}`);
            process.exitCode = 1;
          }
          JS

      - name: Open a deduplicated alert assigned to the owner
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'JS'
          const title = 'HTTPS monitor: certificate or availability needs attention';
          const marker = '<!-- kadastrview-https-monitor -->';
          const base = `https://api.github.com/repos/${process.env.GH_REPO}`;
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json',
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const response = await fetch(`${base}/issues?state=open&per_page=100&creator=github-actions%5Bbot%5D`, { headers });
          if (!response.ok) throw new Error(`Cannot list alerts: HTTP ${response.status}`);
          const issues = await response.json();
          if (issues.some(issue => issue.title === title && issue.body?.includes(marker))) {
            console.log('An HTTPS alert is already open; not sending duplicates.');
          } else {
            const body = `${marker}\nThe daily HTTPS check failed, or a certificate has fewer than 14 days remaining.\n\nCheck the failing host and exact error in [the workflow log](${process.env.RUN_URL}).\n\nKeep Cloudflare DNS authoritative; Netlify should use a standard automatically renewed certificate for kadastrview.online and www.kadastrview.online. Do not bypass certificate validation.\n\nClose this issue after confirming recovery. GitHub email delivery depends on your notification settings.`;
            const created = await fetch(`${base}/issues`, {
              method: 'POST', headers,
              body: JSON.stringify({ title, body, assignees: ['mejison'] }),
            });
            if (!created.ok) throw new Error(`Cannot create alert: HTTP ${created.status}`);
            console.log((await created.json()).html_url);
          }
          JS
