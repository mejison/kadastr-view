[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[dev]
command = "npm run vite"
targetPort = 5173
port = 8888
publish = "dist"
functions = "netlify/functions"

[[redirects]]
from = "https://www.kadastrview.online/*"
to = "https://kadastrview.online/:splat"
status = 301
force = true

[[redirects]]
from = "/api/v1/*"
to = "/.netlify/functions/api/:splat"
status = 200

[[redirects]]
from = "/sitemap-pages.xml"
to = "/.netlify/functions/sitemap-pages"
status = 200
force = true

[[redirects]]
from = "/sitemap-parcels.xml"
to = "/.netlify/functions/sitemap-parcels"
status = 200
force = true

[[redirects]]
from = "/sitemap-locations.xml"
to = "/.netlify/functions/sitemap-locations"
status = 200
force = true

[[redirects]]
from = "/parcel/*"
to = "/dilyanka/:splat"
status = 301
force = true

[[redirects]]
from = "/about"
to = "/.netlify/functions/seo-page/about"
status = 200

[[redirects]]
from = "/data-sources"
to = "/.netlify/functions/seo-page/data-sources"
status = 200

[[redirects]]
from = "/contact"
to = "/.netlify/functions/seo-page/contact"
status = 200

[[redirects]]
from = "/privacy"
to = "/.netlify/functions/seo-page/privacy"
status = 200

[[redirects]]
from = "/terms"
to = "/.netlify/functions/seo-page/terms"
status = 200

[[redirects]]
from = "/guides/*"
to = "/.netlify/functions/seo-page/guides/:splat"
status = 200

[[redirects]]
from = "/guides"
to = "/.netlify/functions/seo-page/guides"
status = 200

[[redirects]]
from = "/oblast"
to = "/.netlify/functions/seo-page/oblast"
status = 200

[[redirects]]
from = "/dilyanka/*"
to = "/.netlify/functions/seo-page/dilyanka/:splat"
status = 200
force = true

[[redirects]]
from = "/oblast/*"
to = "/.netlify/functions/seo-page/oblast/:splat"
status = 200
force = true

[[redirects]]
from = "/raion/*"
to = "/.netlify/functions/seo-page/raion/:splat"
status = 200
force = true

[[redirects]]
from = "/hromada/*"
to = "/.netlify/functions/seo-page/hromada/:splat"
status = 200
force = true

[[redirects]]
from = "/settlement/*"
to = "/.netlify/functions/seo-page/settlement/:splat"
status = 200
force = true

[[headers]]
for = "/sitemap.xml"
[headers.values]
Content-Type = "application/xml; charset=utf-8"
Cache-Control = "public, max-age=60, s-maxage=60, must-revalidate"

[[headers]]
for = "/sitemap-static.xml"
[headers.values]
Content-Type = "application/xml; charset=utf-8"
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/sitemap-pages.xml"
[headers.values]
Content-Type = "application/xml; charset=utf-8"
Cache-Control = "public, max-age=60, s-maxage=60, must-revalidate"

[[headers]]
for = "/sitemap-locations.xml"
[headers.values]
Content-Type = "application/xml; charset=utf-8"
Cache-Control = "public, max-age=60, s-maxage=60, must-revalidate"

[[headers]]
for = "/robots.txt"
[headers.values]
Content-Type = "text/plain; charset=utf-8"
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/favicon.svg"
[headers.values]
Content-Type = "image/svg+xml"
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/og-image.svg"
[headers.values]
Content-Type = "image/svg+xml"
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/og-image.png"
[headers.values]
Content-Type = "image/png"
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/data/*"
[headers.values]
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
